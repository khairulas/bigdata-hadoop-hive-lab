# =============================================================================
# Big Data Lab - docker-compose.yml
#
# Lab coverage
#   Lab 1 - HDFS navigation & file operations   (edge-node -> namenode/datanode)
#   Lab 2 - MapReduce WordCount on YARN         (edge-node -> resourcemanager, nodemanager)
#   Lab 3 - HDFS administration                 (namenode, edge-node)
#   Lab 4 - Log file analysis (MapReduce)       (edge-node -> resourcemanager, nodemanager)
#   Lab 5 - Apache Hive + Hue + Power BI ODBC   (hive-server, postgres, hue)
#
# Student workflow
#   All CLI work runs inside edge-node - NOT namenode.
#   docker exec -it edge-node bash
#     /home/student/training/   read-only lab datasets and supplied source code
#     /home/student/mydata/     writable workspace
#
# -----------------------------------------------------------------------------
# CLASSPATH NOTE - read before editing
#
#   The Hadoop classpath values below are written as ONE UNBROKEN LINE with
#   literal paths. Do NOT reformat them. Two things break MapReduce silently:
#
#     1. YAML folded scalars (>- or >) join wrapped lines with a SPACE.
#        A space after a colon becomes part of the next path entry, so Java
#        looks for " /opt/hadoop-3.2.1/share/..." and finds nothing.
#
#     2. $${HADOOP_HOME} is not expanded when the NodeManager launches a task
#        container, so the path never resolves.
#
#   Either mistake produces:
#        Error: Could not find or load main class org.apache.hadoop.mapred.YarnChild
#
#   The value must also be present on edge-node, because the CLIENT serialises
#   mapreduce.application.classpath into the job config and the NodeManager
#   uses that copy when launching task containers.
# -----------------------------------------------------------------------------

x-hadoop-classpath: &hadoop_classpath /opt/hadoop-3.2.1/etc/hadoop:/opt/hadoop-3.2.1/share/hadoop/common/*:/opt/hadoop-3.2.1/share/hadoop/common/lib/*:/opt/hadoop-3.2.1/share/hadoop/hdfs/*:/opt/hadoop-3.2.1/share/hadoop/hdfs/lib/*:/opt/hadoop-3.2.1/share/hadoop/mapreduce/*:/opt/hadoop-3.2.1/share/hadoop/mapreduce/lib/*:/opt/hadoop-3.2.1/share/hadoop/yarn/*:/opt/hadoop-3.2.1/share/hadoop/yarn/lib/*

x-mapred-home: &mapred_home HADOOP_MAPRED_HOME=/opt/hadoop-3.2.1

services:

  # ---------------------------------------------------------------------------
  # STORAGE LAYER - HDFS
  # ---------------------------------------------------------------------------
  namenode:
    image: bde2020/hadoop-namenode:${HADOOP_IMAGE_TAG}
    container_name: namenode
    restart: unless-stopped
    ports:
      - "9870:9870"   # NameNode Web UI (Labs 1 and 3)
      - "9000:9000"   # HDFS RPC
    environment:
      CLUSTER_NAME: ${CLUSTER_NAME}
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_proxyuser_hue_hosts: "*"
      CORE_CONF_hadoop_proxyuser_hue_groups: "*"
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_replication: "1"
    volumes:
      - namenode_data:/hadoop/dfs/name
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  datanode:
    image: bde2020/hadoop-datanode:${HADOOP_IMAGE_TAG}
    container_name: datanode
    restart: unless-stopped
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "1"
    volumes:
      - datanode_data:/hadoop/dfs/data
    networks:
      - bigdata-net
    depends_on:
      namenode:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g

  # ---------------------------------------------------------------------------
  # COMPUTE LAYER - YARN
  # Labs 2 and 4 - MapReduce jobs
  # ---------------------------------------------------------------------------
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:${HADOOP_IMAGE_TAG}
    container_name: resourcemanager
    restart: unless-stopped
    ports:
      - "8088:8088"   # YARN Resource Manager UI (Labs 2 and 4)
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      MAPRED_CONF_mapreduce_framework_name: yarn
      YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
      MAPRED_CONF_yarn_app_mapreduce_am_env: *mapred_home
      MAPRED_CONF_mapreduce_map_env: *mapred_home
      MAPRED_CONF_mapreduce_reduce_env: *mapred_home
      YARN_CONF_yarn_application_classpath: *hadoop_classpath
      MAPRED_CONF_mapreduce_application_classpath: *hadoop_classpath
      YARN_CONF_yarn_nodemanager_aux___services: mapreduce_shuffle
      YARN_CONF_yarn_nodemanager_aux___services_mapreduce__shuffle_class: org.apache.hadoop.mapred.ShuffleHandler
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_started
    networks:
      - bigdata-net
    deploy:
      resources:
        limits:
          memory: 768m

  nodemanager:
    image: bde2020/hadoop-nodemanager:${HADOOP_IMAGE_TAG}
    container_name: nodemanager
    restart: unless-stopped
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      MAPRED_CONF_mapreduce_framework_name: yarn
      YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
      MAPRED_CONF_yarn_app_mapreduce_am_env: *mapred_home
      MAPRED_CONF_mapreduce_map_env: *mapred_home
      MAPRED_CONF_mapreduce_reduce_env: *mapred_home
      YARN_CONF_yarn_application_classpath: *hadoop_classpath
      MAPRED_CONF_mapreduce_application_classpath: *hadoop_classpath
      YARN_CONF_yarn_nodemanager_aux___services: mapreduce_shuffle
      YARN_CONF_yarn_nodemanager_aux___services_mapreduce__shuffle_class: org.apache.hadoop.mapred.ShuffleHandler
      YARN_CONF_yarn_nodemanager_vmem___check___enabled: "false"
      # Memory budget for YARN containers.
      # 4096 advertised must stay BELOW the Docker limit of 5g below, or the
      # NodeManager promises the scheduler memory the container cannot supply.
      YARN_CONF_yarn_nodemanager_resource_memory___mb: "4096"
      YARN_CONF_yarn_scheduler_minimum___allocation___mb: "512"
      YARN_CONF_yarn_scheduler_maximum___allocation___mb: "4096"
    depends_on:
      resourcemanager:
        condition: service_started
    networks:
      - bigdata-net
    deploy:
      resources:
        limits:
          memory: 5g

  # ---------------------------------------------------------------------------
  # METADATA LAYER - PostgreSQL (Hive Metastore)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:13
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-hive-db.sql:/docker-entrypoint-initdb.d/init-hive-db.sql:ro
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  # ---------------------------------------------------------------------------
  # COMPUTE LAYER - Apache Hive 4 (HiveServer2)
  # Lab 5 - SQL, external and managed tables, partitioning, Avro and Parquet
  # ---------------------------------------------------------------------------
  hive-server:
    build:
      context: .
      dockerfile: Dockerfile.hive
    container_name: hive-server
    restart: unless-stopped
    ports:
      - "10000:10000"   # Beeline / ODBC / Power BI
      - "10002:10002"   # HiveServer2 Web UI
    environment:
      SERVICE_NAME: hiveserver2
      HADOOP_HEAPSIZE: ${HADOOP_HEAPSIZE}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
    volumes:
      - ./hive-entrypoint.sh:/opt/hive/bin/hive-entrypoint.sh:ro
      - hive_home:/home/hive
      - ./training:/home/hive/training:ro
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD-SHELL", "beeline -u 'jdbc:hive2://localhost:10000' -n hive -p ${POSTGRES_PASSWORD} -e 'SHOW DATABASES;' 2>&1 | grep -q 'default'"]
      interval: 30s
      timeout: 90s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3g
    entrypoint: ["/bin/bash", "/opt/hive/bin/hive-entrypoint.sh"]

  # ---------------------------------------------------------------------------
  # STUDENT EDGE NODE - the only container students exec into
  #
  # Why here and NOT namenode:
  #   - NameNode is the cluster control plane; corrupting it kills the lab
  #   - Mirrors real-world practice (gateway / edge node pattern)
  #
  # The YARN and classpath settings below are what make MapReduce jobs run on
  # the cluster rather than in-process. Without mapreduce.framework.name=yarn
  # the job runs under LocalJobRunner and never appears in the YARN UI.
  # ---------------------------------------------------------------------------
  edge-node:
    image: bde2020/hadoop-base:${HADOOP_IMAGE_TAG}
    container_name: edge-node
    restart: unless-stopped
    hostname: edge-node
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HIVE_SERVER2_HOST: hive-server
      HIVE_SERVER2_PORT: "10000"

      # --- Submit to YARN, not LocalJobRunner ---
      MAPRED_CONF_mapreduce_framework_name: yarn

      # --- Where the ResourceManager lives ---
      YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
      YARN_CONF_yarn_resourcemanager_address: resourcemanager:8032
      YARN_CONF_yarn_resourcemanager_scheduler_address: resourcemanager:8030
      YARN_CONF_yarn_resourcemanager_resource__tracker_address: resourcemanager:8031

      # --- Task container environment ---
      MAPRED_CONF_yarn_app_mapreduce_am_env: *mapred_home
      MAPRED_CONF_mapreduce_map_env: *mapred_home
      MAPRED_CONF_mapreduce_reduce_env: *mapred_home

      # --- Classpath the NodeManager uses to launch task containers ---
      # Must be here on the CLIENT, not only on nodemanager.
      MAPRED_CONF_mapreduce_application_classpath: *hadoop_classpath
      YARN_CONF_yarn_application_classpath: *hadoop_classpath

      # --- Container sizing ---
      # AM 1024 + map 1024 + reduce 1024 = 3072, comfortably under the
      # 4096 the NodeManager advertises. Leaving these unset lets the AM
      # round up to the full allocation and starve the map task, which
      # hangs the job at "map 0% reduce 0%".
      MAPRED_CONF_yarn_app_mapreduce_am_resource_mb: "1024"
      MAPRED_CONF_mapreduce_map_memory_mb: "1024"
      MAPRED_CONF_mapreduce_reduce_memory_mb: "1024"
    volumes:
      - ./training:/home/student/training:ro    # Lab datasets and source - read-only
      - student_work:/home/student/mydata       # Writable student workspace
      - ./core-site.xml:/etc/hadoop/conf/core-site.xml:ro
    depends_on:
      namenode:
        condition: service_healthy
      hive-server:
        condition: service_healthy
    networks:
      - bigdata-net
    command: ["tail", "-f", "/dev/null"]
    deploy:
      resources:
        limits:
          memory: 1g

  # ---------------------------------------------------------------------------
  # UI LAYER - Hue
  # ---------------------------------------------------------------------------
  hue:
    image: ${HUE_IMAGE}
    container_name: hue
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./hue.ini:/usr/share/hue/desktop/conf/z-hue.ini:ro
    depends_on:
      namenode:
        condition: service_healthy
      postgres:
        condition: service_healthy
      hive-server:
        condition: service_healthy
    networks:
      - bigdata-net
    deploy:
      resources:
        limits:
          memory: 1g
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "=== Running Hue DB migrations ==="
        ./build/env/bin/hue syncdb --noinput
        ./build/env/bin/hue migrate
        echo "=== Starting Hue ==="
        exec ./startup.sh

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  namenode_data:
  datanode_data:
  postgres_data:
  hive_home:
  student_work:

# =============================================================================
# Network
# =============================================================================
networks:
  bigdata-net:
    driver: bridge
